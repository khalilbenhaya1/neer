services:
  neer-gateway:
    image: ${NEER_IMAGE:-neer:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      NEER_GATEWAY_TOKEN: ${NEER_GATEWAY_TOKEN}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${NEER_CONFIG_DIR}:/home/node/.neer
      - ${NEER_WORKSPACE_DIR}:/home/node/.neer/workspace
    ports:
      - "${NEER_GATEWAY_PORT:-18789}:18789"
      - "${NEER_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${NEER_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]

  neer-cli:
    image: ${NEER_IMAGE:-neer:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      NEER_GATEWAY_TOKEN: ${NEER_GATEWAY_TOKEN}
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${NEER_CONFIG_DIR}:/home/node/.neer
      - ${NEER_WORKSPACE_DIR}:/home/node/.neer/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
