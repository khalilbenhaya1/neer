<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sparkle-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main sparkle star -->
  <g filter="url(#glow)">
    <!-- Center point -->
    <circle cx="60" cy="60" r="8" fill="url(#sparkle-gradient)"/>
    
    <!-- Top ray -->
    <path d="M60 10 L64 52 L60 60 L56 52 Z" fill="url(#sparkle-gradient)"/>
    
    <!-- Right ray -->
    <path d="M110 60 L68 64 L60 60 L68 56 Z" fill="url(#sparkle-gradient)"/>
    
    <!-- Bottom ray -->
    <path d="M60 110 L64 68 L60 60 L56 68 Z" fill="url(#sparkle-gradient)"/>
    
    <!-- Left ray -->
    <path d="M10 60 L52 64 L60 60 L52 56 Z" fill="url(#sparkle-gradient)"/>
    
    <!-- Diagonal rays (shorter) -->
    <!-- Top-right -->
    <path d="M90 30 L66 54 L60 60 L54 54 Z" fill="url(#sparkle-gradient)" opacity="0.8"/>
    
    <!-- Bottom-right -->
    <path d="M90 90 L66 66 L60 60 L66 54 Z" fill="url(#sparkle-gradient)" opacity="0.8"/>
    
    <!-- Bottom-left -->
    <path d="M30 90 L54 66 L60 60 L54 54 Z" fill="url(#sparkle-gradient)" opacity="0.8"/>
    
    <!-- Top-left -->
    <path d="M30 30 L54 54 L60 60 L54 66 Z" fill="url(#sparkle-gradient)" opacity="0.8"/>
  </g>
</svg>
