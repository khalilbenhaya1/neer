services:
  - type: web
    name: neer
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: SETUP_PASSWORD
        sync: false
      - key: NEER_STATE_DIR
        value: /data/.neer
      - key: NEER_WORKSPACE_DIR
        value: /data/workspace
      - key: NEER_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: neer-data
      mountPath: /data
      sizeGB: 1
